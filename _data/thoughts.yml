- id: '20260911231308'
  date: '2026-09-11T23:13:08.459786+01:00'
  text: 'I understand both sides of the assisted dying debate. The level of disability hate in our country is so high and many people would face pressure to take this option. https://www.theguardian.com/uk-news/2026/sep/10/esther-rantzen-now-too-physically-fragile-to-end-her-life-in-switzerland


    But one thing I don''t buy is the argument that "we should fix palliative care first". There''s no way that just because you don''t legalise assisted dying the government will work hard to fix palliative care. It requires money and the major political parties have decided that no additional expenditure is possible because people don''t want to be taxed and because they have agreed to play by a set of fiscal rules that binds their hands.


    Then there''s me personally. If I have to come off my medications or they stop working for me, I will be reduced to lying in bed in agony all day, every day. Throwing up from pain. In abysmal pain, the whole time. I also worry about an eventual death from kidney failure, meaning that I essentially drown in fluid overload inside myself. These prospects of life and death respectively terrify me, and I know that not all pain can be palliated.


    This is why I am a member of DIGNITAS. I want it for me, I am afraid. But the problem is, of course, as per the link above, you will always have to go before you are ready. You cannot afford to be complacent and think, "oh, tomorrow will do". When you''ve got to the point where things are too bad to bear, it is too late for you to travel, too late for you to take this option.'
  bluesky: https://bsky.app/profile/eve.gd/post/3mvbllx4gmq24
  mastodon: https://hcommons.social/@mpe/117254703907989860
