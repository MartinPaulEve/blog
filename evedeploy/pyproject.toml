[project]
name = "evedeploy"
version = "1.0.0"
description = "Build, publish and deploy the eve.gd blog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
]

[project.scripts]
evedeploy = "evedeploy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evedeploy"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version"
]
update_changelog_on_bump = true
