name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ruby 3.2 and build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full build-essential rsync
          ruby -v
          gem env gemdir

      - name: Install bundler and gems
        run: |
          sudo gem install bundler --no-document
          sudo bundle install

      - name: Overlay custom jekyll-feed
        run: |
          sudo rsync -a \
            build_info/var/lib/gems/3.2.0/gems/jekyll-feed-0.17.0/ \
            /var/lib/gems/3.2.0/gems/jekyll-feed-0.17.0/

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          cat ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 644 .github/known_hosts ~/.ssh/known_hosts

      - name: Deploy _site to server
        run: |
          set -euxo pipefail
          SSH='ssh -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key'
          DEST='evegd@68.183.194.201:/home/evegd/www/'
          # Sync top-level files only
          rsync -av \
            --include='/*' \
            --exclude='/**' \
            -e "$SSH" \
            ./_site/ "$DEST"
          # Sync each top-level directory separately
          find ./_site -mindepth 1 -maxdepth 1 -type d -print0 |
            while IFS= read -r -d '' dir; do
              name="$(basename "$dir")"
              rsync -av --delete \
                -e "$SSH" \
                "$dir/" "${DEST}${name}/"
            done
