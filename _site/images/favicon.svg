<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- background -->
  <rect width="64" height="64" rx="14" fill="#0b0b0b"/>

  <!-- cap base (the part on the head): hard-edged trapezoid peeking below the board -->
  <polygon points="25,38 39,38 35.5,50 28.5,50" fill="#8c0d20"/>

  <!-- mortarboard board: faceted diamond (folded, hard-edged) -->
  <polygon points="32,11 6,26 32,41" fill="#f23044"/>   <!-- front-left facet, bright -->
  <polygon points="32,11 58,26 32,41" fill="#d11f37"/>   <!-- right facet, deep -->
  <!-- fold ridge down the middle -->
  <polyline points="32,11 32,41" fill="none" stroke="#0b0b0b" stroke-width="1.4"/>

  <!-- button at the centre -->
  <polygon points="32,22.5 35,26 32,29.5 29,26" fill="#0b0b0b"/>

  <!-- digital tassel: pixel squares hanging off the right corner + square bob -->
  <rect x="54" y="29" width="3.6" height="3.6" fill="#f23044"/>
  <rect x="54.7" y="34.6" width="3.6" height="3.6" fill="#f23044"/>
  <rect x="55.4" y="40.2" width="3.6" height="3.6" fill="#f23044"/>
  <rect x="52.3" y="45.8" width="9" height="9" fill="#f23044"/>
</svg>
