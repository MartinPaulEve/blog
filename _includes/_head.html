<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<!-- Set theme before paint to avoid a flash of the wrong theme. Defaults to light. -->
<script>
    (function () {
        try {
            var stored = localStorage.getItem('theme');
            if (stored === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        } catch (e) {}
    })();
</script>
{% if page.title %}
<title>{{ page.title }} - Martin Paul Eve</title>
{% else %}
<title>Martin Paul Eve</title>
{% endif %}
<!-- Self-hosted fonts (Fraunces, IBM Plex Mono, Newsreader). Mirrored locally for privacy — no third-party requests. -->
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<!-- Self-hosted Font Awesome 6 Free (unmetered). v4-shims maps legacy fa/fa4 class names. -->
<link rel="stylesheet" href="/assets/fontawesome/css/all.min.css">
<link rel="stylesheet" href="/assets/fontawesome/css/v4-shims.min.css">
<link id="hljs-theme" rel="stylesheet" href="/assets/highlightjs/styles/atom-one-light.min.css">
<link rel="stylesheet" href="/assets/css/styles.css?v={{ site.time | date: '%s' }}">
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">


<script type="application/ld+json">
    {
        "@context": "https://schema.org/",
        "@type": "BlogPosting",
        "headline": "{{ page.title }}",
        "author": {
            "@type": "Person",
            "name": "Martin Paul Eve",
            "url": "https://eve.gd"
        },
        "datePublished": "{{ page.date }}",
        "dateCreated": "{{ page.date }}",
        "url": "{{ site.url }}{{ page.url }}",
        "inLanguage ": "en-GB",
        "image": "{{ page.image.feature }}"
    }
</script>

<!-- Open Graph Meta Tags for Social Media Preview -->
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.excerpt | strip_html | truncate: 160 | escape }}">
{% if page.og_image %}
<meta property="og:image" content="{{ page.og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% elsif page.image.feature %}
<meta property="og:image" content="https://eve.gd/images/{{ page.image.feature }}">
{% else %}
<meta property="og:image" content="https://eve.gd/images/og.png">
{% endif %}
<meta property="og:url" content="{{ page.url }}">
<meta property="og:site_name" content="eve.gd: Martin Paul Eve">
<meta property="og:type" content="article" />
<meta property="og:locale" content="en_GB" />
<meta property="og:image:type" content="image/png">

<!-- Twitter Card Meta Tags (Optional but Recommended ) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.excerpt | strip_html | escape }}">
{% if page.og_image_twitter %}
<meta name="twitter:image" content="{{ page.og_image_twitter }}">
{% elsif page.image.feature %}
<meta name="twitter:image" content="https://eve.gd/images/{{ page.image.feature }}">
{% else %}
<meta name="twitter:image" content="https://eve.gd/images/og.png">
{% endif %}

<meta name="twitter:creator" content="@martin_eve">

<!-- Additional Useful Meta Tags -->
<meta name="description" content="{{ page.excerpt | strip_html | escape }}">
<meta property="article:published_time" content="{{ page.date }}">
<meta property="article:author" content="Martin Paul Eve">

<link href="https://eve.gd/feed/feed.atom" type="application/atom+xml" rel="alternate" title="Martin Paul Eve Feed">

{% if page.atUri %}
<!-- ATProto link to site.standard.document -->            
<link rel="site.standard.document" href="{{ page.atUri | escape }}">
{% endif %}
