[project]
name = "thought-composer"
version = "1.0.0"
description = "Compose short thoughts for eve.gd: TUI with Bluesky-limit character count, cross-posting to Bluesky and Mastodon (threading when needed), image attachments, and a quick build+rsync deploy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
    "regex>=2024.0",
    "pillow>=10.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
thought = "thought_composer.cli:main"
thought-probe = "thought_composer.cli:probe_main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thought_composer"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version"
]
update_changelog_on_bump = true
