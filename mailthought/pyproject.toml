[project]
name = "mailthought"
version = "1.0.0"
description = "Email-to-thought gateway for eve.gd: Mailgun inbound webhook that validates senders, supports dry-run-by-email with POST-reply confirmation, and publishes short thoughts through the existing thought_composer/evedeploy pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "requests>=2.32",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailthought"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version"
]
update_changelog_on_bump = true
