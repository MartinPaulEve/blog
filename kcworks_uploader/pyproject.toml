[project]
name = "kcworks-uploader"
version = "1.0.0"
description = "Upload eve.gd blog posts to KC Works as draft records with markdown and PDF attachments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "pyyaml>=6.0",
]

[project.scripts]
kcworks-upload = "kcworks_uploader.cli:main"
kcworks-publish = "kcworks_uploader.cli:publish_main"
kcworks-collection = "kcworks_uploader.cli:collection_main"
kcworks-backfill = "kcworks_uploader.cli:backfill_main"
kcworks-update = "kcworks_uploader.cli:update_main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kcworks_uploader"]

[tool.commitizen]
version = "1.0.0"
version_files = [
    "__version__.py",
    "pyproject.toml:version"
]
update_changelog_on_bump = true
